name: aggregator CI

on:
  push:
    branches: [main]
    paths: ["aggregator/**", ".github/workflows/aggregator-ci.yml"]
  pull_request:
    paths: ["aggregator/**", ".github/workflows/aggregator-ci.yml"]

defaults:
  run:
    working-directory: aggregator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=sediment_aggregator --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sediment-aggregator:ci .
